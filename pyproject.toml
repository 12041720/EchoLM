[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "echolm"
version = "0.1.0"
description = "A language model that never hallucinates — f(x) = x"
readme = "README.md"
requires-python = ">=3.8"

[project.optional-dependencies]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
echolm = "echolm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
